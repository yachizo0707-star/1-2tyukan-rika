<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="理科ドリル">
<meta name="theme-color" content="#0d0f1a">
<title>理科ドリル</title>
<style>
:root {
  --bg:#0d0f1a; --surface:#141728; --surface2:#1e2340;
  --text:#e8eaf6; --text2:#7880a0;
  --radius:14px;
  --correct:#69c46d; --wrong:#e05c5c; --combo:#ffd54f;
  /* subject colors */
  --bio:#4caf7d; --bio-dark:#0d2018;
  --phy:#7c83ff; --phy-dark:#0d0f2a;
  --geo:#f4a736; --geo-dark:#2a1a00;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;}
body{
  font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-text-size-adjust:100%;
  position:fixed;width:100%;
}
.screen{
  display:none;flex-direction:column;
  position:absolute;inset:0;overflow:hidden;
}
.screen.active{display:flex;}
/* スクロールが必要な画面だけ内部スクロール */
#top,#home,#level-select,#result{
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}

/* ===== TOP (subject select) ===== */
#top{
  align-items:center;
  padding:32px 20px calc(32px + env(safe-area-inset-bottom));
  padding-top:calc(40px + env(safe-area-inset-top));
  gap:18px;
}
.app-logo{font-size:54px;text-align:center;}
.app-title{font-size:28px;font-weight:800;letter-spacing:.05em;text-align:center;}
.app-title span{background:linear-gradient(90deg,var(--bio),var(--phy),var(--geo));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.app-sub{font-size:12px;color:var(--text2);text-align:center;}
.subject-cards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px;}
.subj-card{
  border:none;border-radius:18px;padding:22px;
  display:flex;align-items:center;gap:16px;cursor:pointer;
  text-align:left;-webkit-appearance:none;transition:transform .1s;
  min-height:88px;
}
.subj-card:active{transform:scale(.98);}
.subj-card.bio{background:linear-gradient(135deg,#0d2a1a,#152e1e);border:1.5px solid var(--bio);}
.subj-card.phy{background:linear-gradient(135deg,#0d0f2a,#141830);border:1.5px solid var(--phy);}
.subj-card.geo{background:linear-gradient(135deg,#2a1800,#2e1e00);border:1.5px solid var(--geo);}
.subj-icon{font-size:36px;flex-shrink:0;}
.subj-info{flex:1;}
.subj-name{font-size:18px;font-weight:800;}
.subj-desc{font-size:11px;margin-top:3px;opacity:.7;}
.subj-count{font-size:11px;font-weight:600;margin-top:5px;opacity:.8;}
.subj-card.bio .subj-name{color:var(--bio);}
.subj-card.phy .subj-name{color:var(--phy);}
.subj-card.geo .subj-name{color:var(--geo);}
.subj-arrow{font-size:20px;opacity:.5;}

/* ===== HOME (per-subject) ===== */
#home{
  align-items:center;
  padding:24px 20px calc(24px + env(safe-area-inset-bottom));
  padding-top:calc(24px + env(safe-area-inset-top));
  gap:14px;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.back-btn{background:none;border:none;font-size:15px;cursor:pointer;-webkit-appearance:none;padding:10px 0;min-height:44px;align-self:flex-start;display:flex;align-items:center;}
.logo-area{text-align:center;}
.logo-icon{font-size:48px;}
.logo-title{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:.04em;}
.logo-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.stats-bar{
  display:flex;gap:10px;background:var(--surface);
  border-radius:var(--radius);padding:12px 16px;width:100%;max-width:380px;
}
.stat{flex:1;text-align:center;}
.stat-val{font-size:20px;font-weight:700;}
.stat-label{font-size:10px;color:var(--text2);margin-top:2px;}
.section-label{
  font-size:10px;font-weight:700;letter-spacing:.1em;
  color:var(--text2);align-self:flex-start;width:100%;max-width:380px;
}
.stats-chart-card{
  background:var(--surface);border-radius:var(--radius);
  padding:14px 16px;width:100%;max-width:380px;
}
.stats-chart-title{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.08em;margin-bottom:10px;}
.unit-stat-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.unit-stat-row:last-child{margin-bottom:0;}
.unit-stat-icon{font-size:16px;flex-shrink:0;}
.unit-stat-info{flex:1;}
.unit-stat-name{font-size:11px;font-weight:600;margin-bottom:3px;}
.unit-stat-bar-wrap{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;}
.unit-stat-bar-fill{height:100%;border-radius:3px;transition:width .6s ease;}
.unit-stat-pct{font-size:11px;font-weight:700;min-width:34px;text-align:right;}
.weak-card{
  background:linear-gradient(135deg,#1a1500,#201a00);
  border:1.5px solid var(--combo);border-radius:var(--radius);
  padding:14px 16px;width:100%;max-width:380px;
  display:none;cursor:pointer;-webkit-appearance:none;
}
.weak-card.visible{display:block;}
.weak-card-header{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.weak-card-title{font-size:14px;font-weight:700;color:var(--combo);}
.weak-card-sub{font-size:11px;color:var(--text2);}
.review-home-btn{
  background:var(--surface);border:1.5px solid #f4a736;
  border-radius:var(--radius);padding:14px 16px;
  display:none;align-items:center;gap:12px;
  cursor:pointer;text-align:left;width:100%;max-width:380px;-webkit-appearance:none;
}
.review-home-btn.visible{display:flex;}
.review-home-icon{font-size:22px;flex-shrink:0;}
.review-home-info{flex:1;}
.review-home-title{font-size:14px;font-weight:700;color:#f4a736;}
.review-home-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.unit-list{display:flex;flex-direction:column;gap:8px;width:100%;max-width:380px;}
.unit-btn{
  background:var(--surface);border:none;border-radius:var(--radius);
  padding:16px;display:flex;align-items:center;gap:12px;
  cursor:pointer;text-align:left;-webkit-appearance:none;transition:background .15s;
  min-height:64px;
}
.unit-btn:active{background:var(--surface2);}
.unit-icon{font-size:24px;flex-shrink:0;}
.unit-info{flex:1;}
.unit-name{font-size:14px;font-weight:600;}
.unit-count{font-size:11px;color:var(--text2);margin-top:2px;}
.unit-arrow{font-size:16px;color:var(--text2);}

/* ===== LEVEL SELECT ===== */
#level-select{
  padding:20px;padding-top:calc(20px + env(safe-area-inset-top));
  gap:14px;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.page-title{font-size:20px;font-weight:700;}
.page-sub{font-size:12px;color:var(--text2);}
.mode-toggle-row{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border-radius:10px;padding:12px 16px;
}
.mode-toggle-label{font-size:14px;font-weight:600;flex:1;}
.mode-toggle-sub{font-size:11px;color:var(--text2);}
.toggle-switch{
  position:relative;width:44px;height:26px;
  background:var(--surface2);border-radius:13px;
  cursor:pointer;transition:background .2s;flex-shrink:0;
}
.toggle-switch.on{background:var(--correct);}
.toggle-knob{
  position:absolute;top:3px;left:3px;
  width:20px;height:20px;border-radius:50%;
  background:white;transition:transform .2s;
}
.toggle-switch.on .toggle-knob{transform:translateX(18px);}
.level-list{display:flex;flex-direction:column;gap:10px;}
.level-btn{
  background:var(--surface);border:2px solid transparent;
  border-radius:var(--radius);padding:18px;cursor:pointer;
  text-align:left;-webkit-appearance:none;transition:border-color .15s;
  min-height:80px;
}
.level-btn:active{border-color:var(--correct);}
.level-badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;margin-bottom:5px;}
.lv1 .level-badge{background:#1b5e20;color:#a5d6a7;}
.lv2 .level-badge{background:#1a3a00;color:#b5e57a;}
.lv3 .level-badge{background:#4a3500;color:#ffe082;}
.level-name{font-size:15px;font-weight:700;}
.level-desc{font-size:12px;color:var(--text2);margin-top:2px;}
.level-qcount{font-size:11px;color:var(--text2);margin-top:5px;}

/* ===== QUIZ ===== */
#quiz{
  display:none;flex-direction:column;
  position:absolute;inset:0;overflow:hidden;
}
#quiz.active{display:flex;}
.quiz-header{
  flex-shrink:0;
  background:var(--surface);padding:10px 16px;
  padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;
}
.quiz-back{
  background:none;border:none;font-size:20px;
  cursor:pointer;-webkit-appearance:none;
  min-width:44px;min-height:44px;
  display:flex;align-items:center;justify-content:center;
}
.progress-wrap{flex:1;}
.progress-text{font-size:11px;color:var(--text2);margin-bottom:3px;}
.progress-bar{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;border-radius:2px;transition:width .3s ease;}
.score-badge{background:var(--bg);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700;}
.timer-bar-wrap{flex-shrink:0;height:5px;background:var(--bg);}
.timer-bar-fill{height:100%;transition:width .1s linear,background .3s;}
.combo-banner{
  flex-shrink:0;display:none;text-align:center;font-size:13px;font-weight:700;
  color:var(--combo);padding:6px;background:rgba(255,213,79,.1);
  animation:comboPop .3s ease;
}
.combo-banner.show{display:block;}
@keyframes comboPop{0%{transform:scale(.8);opacity:0;}100%{transform:scale(1);opacity:1;}}
.quiz-body{
  flex:1;padding:14px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom));
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;gap:12px;
  /* iOS momentum scroll */
  -webkit-overflow-scrolling:touch;
}
.question-card{background:var(--surface);border-radius:var(--radius);padding:14px;}
.question-level{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text2);margin-bottom:6px;}
.question-text{font-size:15px;font-weight:600;line-height:1.6;}
.svg-container{
  background:#f0faf0;border-radius:10px;padding:8px;
  display:none;justify-content:center;align-items:center;margin-top:10px;
}
.svg-container.show{display:flex;}
.svg-container svg{max-width:100%;height:auto;}
.highlight-part{animation:pulseH 1.5s ease-in-out infinite;}
@keyframes pulseH{0%,100%{opacity:1;}50%{opacity:.35;}}
.choices{display:flex;flex-direction:column;gap:8px;}
.choice-btn{
  background:var(--surface);border:2px solid var(--surface2);
  border-radius:var(--radius);padding:14px 16px;
  font-size:16px;font-weight:500;color:var(--text);line-height:1.5;
  cursor:pointer;text-align:left;-webkit-appearance:none;
  transition:border-color .15s,background .15s;
  min-height:52px;
  /* prevent text selection on tap */
  -webkit-user-select:none;user-select:none;
}
.choice-btn:active{background:var(--surface2);}
.choice-btn.correct{border-color:var(--correct);background:rgba(105,196,109,.12);}
.choice-btn.wrong{border-color:var(--wrong);background:rgba(224,92,92,.12);}
.explanation-card{
  background:var(--surface);border-radius:var(--radius);padding:14px;
  border-left:3px solid var(--correct);display:none;
}
.explanation-card.show{display:block;}
.exp-label{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text2);margin-bottom:6px;}
.exp-text{font-size:13px;line-height:1.7;color:var(--text);}
.next-btn{
  background:var(--correct);border:none;border-radius:var(--radius);
  padding:16px;font-size:16px;font-weight:700;color:white;
  cursor:pointer;width:100%;-webkit-appearance:none;display:none;
  min-height:52px;
}
.next-btn.show{display:block;}

/* ===== RESULT ===== */
#result{
  align-items:center;
  padding:32px 20px calc(32px + env(safe-area-inset-bottom));
  padding-top:calc(32px + env(safe-area-inset-top));
  gap:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.result-icon{font-size:56px;}
.result-title{font-size:22px;font-weight:800;}
.result-score-box{
  background:var(--surface);border-radius:var(--radius);
  padding:20px;width:100%;max-width:380px;text-align:center;
}
.result-pts{font-size:40px;font-weight:800;}
.result-pts-label{font-size:12px;color:var(--text2);margin-top:4px;}
.result-stats{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  gap:10px;margin-top:14px;
}
.result-stat{text-align:center;}
.result-stat-val{font-size:18px;font-weight:700;}
.result-stat-label{font-size:10px;color:var(--text2);margin-top:2px;}
.wrong-list-card{
  background:var(--surface);border-radius:var(--radius);
  padding:14px;width:100%;max-width:380px;
}
.wrong-list-title{font-size:12px;font-weight:700;color:var(--wrong);margin-bottom:10px;}
.wrong-item{font-size:12px;color:var(--text2);padding:6px 0;border-bottom:1px solid var(--surface2);}
.wrong-item:last-child{border-bottom:none;}
.btn-row{display:flex;flex-direction:column;gap:10px;width:100%;max-width:380px;}
.btn{
  border:none;border-radius:var(--radius);padding:16px;
  font-size:16px;font-weight:700;cursor:pointer;-webkit-appearance:none;
  transition:opacity .15s;min-height:52px;
}
.btn:active{opacity:.7;}
.btn-primary{color:white;}
.btn-secondary{background:var(--surface);color:var(--text);}
</style>
</head>
<body>
<!-- SCREENS -->
<div id="top" class="screen active">
  <div class="app-logo">🔬</div>
  <div class="app-title"><span>理科ドリル</span></div>
  <div class="app-sub">生物 · 物理 · 地学　総合問題集</div>
  <div class="subject-cards">
    <button class="subj-card bio" onclick="selectSubject('bio')">
      <span class="subj-icon">🌱</span>
      <div class="subj-info">
        <div class="subj-name">生物</div>
        <div class="subj-desc">根・茎のつくりとはたらき（テスト範囲）</div>
        <div class="subj-count">1単元 · 37問</div>
      </div>
      <span class="subj-arrow">›</span>
    </button>
    <button class="subj-card phy" onclick="selectSubject('phy')">
      <span class="subj-icon">⚡</span>
      <div class="subj-info">
        <div class="subj-name">物理</div>
        <div class="subj-desc">光の反射・屈折 / 凸レンズ / 波の性質</div>
        <div class="subj-count">3単元 · 115問</div>
      </div>
      <span class="subj-arrow">›</span>
    </button>
    <button class="subj-card geo" onclick="selectSubject('geo')">
      <span class="subj-icon">🌤</span>
      <div class="subj-info">
        <div class="subj-name">地学</div>
        <div class="subj-desc">気象観測 / 水蒸気 / 気圧と風</div>
        <div class="subj-count">3単元 · 86問</div>
      </div>
      <span class="subj-arrow">›</span>
    </button>
  </div>
</div>

<div id="home" class="screen">
  <button class="back-btn" id="home-back" onclick="goTop()">‹ 科目選択</button>
  <div class="logo-area">
    <div class="logo-icon" id="home-icon"></div>
    <div class="logo-title" id="home-title"></div>
    <div class="logo-sub" id="home-sub"></div>
  </div>
  <div class="stats-bar" id="stats-bar">
    <div class="stat"><div class="stat-val" id="stat-pts">0</div><div class="stat-label">ポイント</div></div>
    <div class="stat"><div class="stat-val" id="stat-level">1</div><div class="stat-label">レベル</div></div>
    <div class="stat"><div class="stat-val" id="stat-total">0</div><div class="stat-label">挑戦数</div></div>
  </div>
  <div class="stats-chart-card">
    <div class="stats-chart-title">📊 単元別正答率</div>
    <div id="unit-chart"></div>
  </div>
  <button class="weak-card" id="weak-card" onclick="startWeak()">
    <div class="weak-card-header">
      <span class="weak-card-icon">🎯</span>
      <span class="weak-card-title">苦手ピックアップ</span>
    </div>
    <div class="weak-card-sub">よく間違える問題を集中特訓！</div>
    <div class="weak-card-count" id="weak-count"></div>
  </button>
  <button class="review-home-btn" id="review-btn" onclick="startReview()">
    <span class="review-home-icon">📖</span>
    <div class="review-home-info">
      <div class="review-home-title">間違えた問題を復習</div>
      <div class="review-home-sub" id="review-count-text"></div>
    </div>
    <span class="unit-arrow">›</span>
  </button>
  <div class="section-label">UNITS</div>
  <div class="unit-list" id="unit-list"></div>
</div>

<div id="level-select" class="screen">
  <button class="back-btn" onclick="showHome()">‹ ホーム</button>
  <div class="page-title" id="ls-title"></div>
  <div class="page-sub" id="ls-sub"></div>
  <div class="mode-toggle-row">
    <div>
      <div class="mode-toggle-label">⏱ タイムアタック</div>
      <div class="mode-toggle-sub">30秒以内に回答</div>
    </div>
    <div class="toggle-switch" id="ta-toggle" onclick="toggleTimeAttack()">
      <div class="toggle-knob"></div>
    </div>
  </div>
  <div class="level-list" id="level-list"></div>
</div>

<div id="quiz" class="screen">
  <div class="quiz-header">
    <button class="quiz-back" id="quiz-back-btn" onclick="confirmQuit()">✕</button>
    <div class="progress-wrap">
      <div class="progress-text" id="progress-text"></div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <div class="score-badge" id="score-badge">0pt</div>
  </div>
  <div class="timer-bar-wrap"><div class="timer-bar-fill" id="timer-bar" style="width:100%"></div></div>
  <div class="combo-banner" id="combo-banner"></div>
  <div class="quiz-body">
    <div class="question-card">
      <div class="question-level" id="q-level"></div>
      <div class="question-text" id="q-text"></div>
      <div class="svg-container" id="svg-container"></div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="explanation-card" id="explanation-card">
      <div class="exp-label">EXPLANATION</div>
      <div class="exp-text" id="exp-text"></div>
    </div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題 →</button>
  </div>
</div>

<div id="result" class="screen">
  <div class="result-icon" id="result-icon">🎉</div>
  <div class="result-title" id="result-title">クリア！</div>
  <div class="result-score-box">
    <div class="result-pts" id="result-pts">0</div>
    <div class="result-pts-label">獲得ポイント</div>
    <div class="result-stats">
      <div class="result-stat"><div class="result-stat-val" id="res-correct">0</div><div class="result-stat-label">正解</div></div>
      <div class="result-stat"><div class="result-stat-val" id="res-total">0</div><div class="result-stat-label">問題数</div></div>
      <div class="result-stat"><div class="result-stat-val" id="res-pct">0%</div><div class="result-stat-label">正答率</div></div>
    </div>
  </div>
  <div class="wrong-list-card" id="wrong-list-card" style="display:none">
    <div class="wrong-list-title">❌ 間違えた問題</div>
    <div id="wrong-list"></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="res-retry-btn" onclick="retryQuiz()" style="display:none"></button>
    <button class="btn btn-secondary" onclick="showHome()">ホームへ戻る</button>
  </div>
</div>
<script>
const BIO_SVGS = {
  abrana_flower: (hl) => `<svg viewBox="0 0 320 260" width="290" height="235" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="ar" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#444"/></marker></defs>
  <rect width="320" height="260" fill="#f0faf0" rx="8"/>
  <ellipse cx="160" cy="205" rx="68" ry="16" fill="#5a9e5a" opacity=".75" ${hl==='がく'?'class="highlight-part"':''}/>

{ id:'c8b11', unit:'C8', level:'BASIC',

{ id:'c8s03', unit:'C8', level:'STANDARD',

  exp:'気圧が異なると、高い方から低い方へ気圧傾度力（気圧差による力）がはたらき、風がふく。' },

  q:'1日目は晴れ、2日目は雨が降った。気圧の変化として正しいのはどれか。',
  choices:['1日目は比較的気圧が高く、2日目は低くなった','1日目は気圧が低く、2日目は高くなった','両日とも同じ気圧','雨の日が高い気圧'], ans:0,
  exp:'高気圧→晴れ、低気圧→くもり・雨。1日目晴れ→高気圧、2日目雨→低気圧と推定できる。' },

{ id:'c8s06', unit:'C8', level:'STANDARD',
  q:'夕立が起きる仕組みで正しいのはどれか。',
  choices:['昼間の太陽熱で地面が温まり、上昇気流から積乱雲が発生する','低気圧が接近する','前線が通過する','海風が吹き込む'], ans:0,
  exp:'晴れた夏の昼に地面が温まり空気が膨張→密度低下→局地的な上昇気流→積乱雲→夕立。' },

  q:'低気圧のまわりの等圧線を見ると、中心に向かうほど気圧はどうなっているか。',
  choices:['低くなっている','高くなっている','一定','変化しない'], ans:0,
  exp:'低気圧は中心が最も気圧が低く、外側に向かうほど気圧が高くなる。等圧線は低気圧の中心を囲む。' },

{ id:'c8s08', unit:'C8', level:'STANDARD',
  q:'高気圧の地上付近で雲ができにくい理由は？',
  choices:['下降気流があり、空気が圧縮・昇温して相対湿度が下がるから','気圧が高いから','風が強いから','気温が高いから'], ans:0,
  exp:'高気圧の中心では下降気流が生じ、空気が下がるにつれて圧縮・昇温し、湿度が下がって雲ができにくい。' },

/* ────────── C8 ADVANCED ────────── */
{ id:'c8a01', unit:'C8', level:'ADVANCED',
  q:'北半球では低気圧に反時計回りに風がふきこみ、高気圧では時計回りにふき出す。この原因は何か。',
  choices:['地球の自転（コリオリの力）','重力','気圧差だけ','太陽の光'], ans:0,
  exp:'地球の自転によって北半球では運動する物体が右向きに曲がる力（コリオリの力）がはたらき、風向が決まる。' },

{ id:'c8a02', unit:'C8', level:'ADVANCED',
  q:'1000hPaの等圧線の1つ外側（高気圧側）にある地点の気圧は何hPaか。（4hPaおきの等圧線）',
  choices:['1004hPa','996hPa','1008hPa','1000hPa'], ans:0,
  exp:'外側（高気圧側）に向かうと気圧は高くなる。1000hPaの1つ外側は1000＋4＝1004hPa。' },

{ id:'c8a03', unit:'C8', level:'ADVANCED',
  q:'天気図から「等圧線の間隔が狭い」ことからわかることは何か。',
  choices:['その付近の風が強い','気温が高い','湿度が高い','雨が降る'], ans:0,
  exp:'等圧線の間隔が狭い→気圧傾度が大きい→強い風がふく。台風では等圧線が密集し暴風となる。' },

{ id:'c8a04', unit:'C8', level:'ADVANCED',
  q:'X地点の気圧が図1（1024〜1028hPaの等圧線間）から図2（1000hPa等圧線上）に変化したとき、変化量は何hPaか。',
  choices:['約26hPa低下','約26hPa上昇','4hPa低下','変化なし'], ans:0,
  exp:'図1の気圧は1024〜1028hPaの中間→約1026hPa。図2では1000hPa。変化量1026－1000＝26hPa低下。' },

{ id:'c8a05', unit:'C8', level:'ADVANCED',
  q:'等圧線間隔の狭い順に風の強い地点を並べたとき正しいのはどれか。（B>A>Cの順に間隔が狭い）',
  choices:['B＞A＞C','A＞B＞C','C＞A＞B','すべて同じ'], ans:0,
  exp:'等圧線の間隔が狭い順＝風が強い順。間隔B<A<CならばBの風が最強。' },

];
</script>
<script>
// ===== SUBJECT CONFIG =====
const SUBJECTS = {
  bio: { name:'生物', icon:'🌱', color:'#4caf7d', accent:'--bio',
         sub:'根・茎のつくりとはたらき', lsKey:'rika_bio',
         unitFilter:[2] },
  phy: { name:'物理', icon:'⚡', color:'#7c83ff', accent:'--phy',
         sub:'光の反射・屈折 / 凸レンズ / 波の性質', lsKey:'rika_phy' },
  geo: { name:'地学', icon:'🌤', color:'#f4a736', accent:'--geo',
         sub:'気象観測 / 水蒸気 / 気圧と風', lsKey:'rika_geo' },
};

// ===== STATE =====
let currentSubject = null; // 'bio'|'phy'|'geo'
let currentUnit = null;
let currentLevel = null;   // 0=BASIC,1=STANDARD,2=ADVANCED
let quizQueue = [];
let quizIdx = 0;
let sessionPts = 0;
let sessionCorrect = 0;
let sessionWrong = [];
let combo = 0;
let timeAttack = false;
let timerInterval = null;
let timeLeft = 30;
let answered = false;
let isReview = false;
let isWeak = false;

// ===== localStorage helpers =====
function loadState(subj) {
  const def = { points:0, totalAnswered:0,
    unitStats:{}, wrongBank:[], wrongFreq:{} };
  try { return Object.assign({}, def, JSON.parse(localStorage.getItem(SUBJECTS[subj].lsKey)||'null')||{}); }
  catch(e){ return def; }
}
function saveState(subj, d) {
  try { localStorage.setItem(SUBJECTS[subj].lsKey, JSON.stringify(d)); } catch(e){}
}

// ===== SUBJECT SELECT =====
function selectSubject(subj) {
  currentSubject = subj;
  showHome();
}

function goTop() {
  showScreen('top');
}

// ===== HOME =====
function showHome() {
  const s = SUBJECTS[currentSubject];
  const d = loadState(currentSubject);

  // header
  document.getElementById('home-icon').textContent = s.icon;
  document.getElementById('home-title').textContent = s.name + 'ドリル';
  document.getElementById('home-sub').textContent = s.sub;
  document.getElementById('home-back').style.color = s.color;

  // stats
  const level = Math.floor(d.points/50)+1;
  document.getElementById('stat-pts').textContent = d.points;
  document.getElementById('stat-pts').style.color = s.color;
  document.getElementById('stat-level').textContent = level;
  document.getElementById('stat-level').style.color = s.color;
  document.getElementById('stat-total').textContent = d.totalAnswered;
  document.getElementById('stat-total').style.color = s.color;

  // unit chart & list
  renderUnitChart(currentSubject, d);
  renderUnitList(currentSubject, d);

  // weak pickup
  const freq = d.wrongFreq || {};
  const weakIds = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>x[0]);
  const wc = document.getElementById('weak-card');
  if(weakIds.length >= 3) {
    wc.classList.add('visible');
    document.getElementById('weak-count').textContent = `苦手問題 ${weakIds.length}問`;
  } else { wc.classList.remove('visible'); }

  // review
  const rb = document.getElementById('review-btn');
  const wb = d.wrongBank||[];
  if(wb.length > 0) {
    rb.classList.add('visible');
    document.getElementById('review-count-text').textContent = `${wb.length}問 復習待ち`;
  } else { rb.classList.remove('visible'); }

  showScreen('home');
}

function getUnitsForSubject(subj) {
  if(subj==='bio') {
    const filter = SUBJECTS.bio.unitFilter;
    return filter ? BIO_UNITS.filter((_,i)=>filter.includes(i)) : BIO_UNITS;
  }
  if(subj==='phy') return PHY_UNITS;
  if(subj==='geo') return GEO_UNITS;
}
// 表示用インデックス→実際のBIO_UNITSインデックスに変換
function bioRealIdx(displayIdx) {
  const filter = SUBJECTS.bio.unitFilter;
  return filter ? filter[displayIdx] : displayIdx;
}

function renderUnitChart(subj, d) {
  const units = getUnitsForSubject(subj);
  const s = SUBJECTS[subj];
  let html = '';
  units.forEach((u, i) => {
    const realI = subj==='bio' ? bioRealIdx(i) : i;
    const key = subj==='bio' ? String(realI) : u.id;
    const st = d.unitStats[key] || {c:0,t:0};
    const pct = st.t>0 ? Math.round(st.c/st.t*100) : 0;
    html += `<div class="unit-stat-row">
      <span class="unit-stat-icon">${u.icon||'📘'}</span>
      <div class="unit-stat-info">
        <div class="unit-stat-name">${u.name}</div>
        <div class="unit-stat-bar-wrap">
          <div class="unit-stat-bar-fill" style="width:${pct}%;background:${s.color}"></div>
        </div>
      </div>
      <span class="unit-stat-pct" style="color:${s.color}">${pct}%</span>
    </div>`;
  });
  document.getElementById('unit-chart').innerHTML = html;
}

function renderUnitList(subj, d) {
  const units = getUnitsForSubject(subj);
  const s = SUBJECTS[subj];
  let html = '';
  units.forEach((u, i) => {
    const realI = subj==='bio' ? bioRealIdx(i) : i;
    const key = subj==='bio' ? String(realI) : u.id;
    const st = d.unitStats[key] || {c:0,t:0};
    const total = subj==='bio'
      ? u.levels.reduce((a,l)=>a+l.length,0)
      : (subj==='phy' ? PHY_ALL.filter(q=>q.unit===u.id).length : GEO_ALL.filter(q=>q.unit===u.id).length);
    html += `<button class="unit-btn" onclick="goLevelSelect(${i})">
      <span class="unit-icon">${u.icon||'📘'}</span>
      <div class="unit-info">
        <div class="unit-name">${u.name}</div>
        <div class="unit-count">全${total}問 · ${st.t>0?Math.round(st.c/st.t*100):0}% 正解</div>
      </div>
      <span class="unit-arrow" style="color:${s.color}">›</span>
    </button>`;
  });
  document.getElementById('unit-list').innerHTML = html;
}

// ===== LEVEL SELECT =====
function goLevelSelect(unitIdx) {
  currentUnit = unitIdx;
  isReview = false; isWeak = false;
  const units = getUnitsForSubject(currentSubject);
  const u = units[unitIdx];
  const s = SUBJECTS[currentSubject];
  document.getElementById('ls-title').textContent = u.name;
  document.getElementById('ls-sub').textContent = s.name + 'ドリル';

  const lvNames = ['🟢 BASIC','🔵 STANDARD','🟡 ADVANCED'];
  const lvDescs = ['基礎・定義・用語確認','応用・計算・グラフ読み取り','難問・総合・記述型'];
  let html = '';
  for(let lv=0; lv<3; lv++){
    const qs = getQsByUnitLevel(currentSubject, unitIdx, lv);
    html += `<div class="level-btn lv${lv+1}" onclick="startQuiz(${lv})">
      <span class="level-badge">${lvNames[lv]}</span>
      <div class="level-name">${lvDescs[lv]}</div>
      <div class="level-qcount">${qs.length}問</div>
    </div>`;
  }
  document.getElementById('level-list').innerHTML = html;
  showScreen('level-select');
}

function getQsByUnitLevel(subj, unitIdx, lv) {
  if(subj==='bio') {
    const realIdx = bioRealIdx(unitIdx);
    return BIO_UNITS[realIdx].levels[lv].map((q,i)=>({
      ...q, _subj:'bio', _unit:String(realIdx), _lv:lv,
      _id:`bio_${realIdx}_${lv}_${i}`
    }));
  }
  const units = subj==='phy' ? PHY_UNITS : GEO_UNITS;
  const all   = subj==='phy' ? PHY_ALL   : GEO_ALL;
  const uid = units[unitIdx].id;
  const lvMap = ['BASIC','STANDARD','ADVANCED'];
  return all.filter(q=>q.unit===uid && q.level===lvMap[lv]).map(q=>({
    ...q, _subj:subj, _unit:uid, _lv:lv, _id:q.id
  }));
}

function toggleTimeAttack() {
  timeAttack = !timeAttack;
  document.getElementById('ta-toggle').classList.toggle('on', timeAttack);
}

// ===== START QUIZ =====
function startQuiz(lv) {
  currentLevel = lv;
  quizQueue = shuffle([...getQsByUnitLevel(currentSubject, currentUnit, lv)]);
  beginQuiz();
}

function startWeak() {
  const d = loadState(currentSubject);
  const freq = d.wrongFreq||{};
  const ids = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>x[0]);
  quizQueue = shuffle(buildQueueFromIds(currentSubject, ids));
  isWeak = true; isReview = false;
  beginQuiz();
}

function startReview() {
  const d = loadState(currentSubject);
  const ids = d.wrongBank||[];
  quizQueue = shuffle(buildQueueFromIds(currentSubject, ids));
  isReview = true; isWeak = false;
  beginQuiz();
}

function buildQueueFromIds(subj, ids) {
  const all = getAllQs(subj);
  return ids.map(id=>all.find(q=>q._id===id)).filter(Boolean);
}

function getAllQs(subj) {
  if(subj==='bio') {
    return BIO_UNITS.flatMap((u,ui)=>
      u.levels.flatMap((lvArr,lv)=>
        lvArr.map((q,i)=>({...q,_subj:'bio',_unit:String(ui),_lv:lv,_id:`bio_${ui}_${lv}_${i}`}))));
  }
  const all = subj==='phy' ? PHY_ALL : GEO_ALL;
  const lvMap = ['BASIC','STANDARD','ADVANCED'];
  return all.map(q=>({...q,_subj:subj,_unit:q.unit,_lv:lvMap.indexOf(q.level),_id:q.id}));
}

function beginQuiz() {
  quizIdx = 0; sessionPts = 0; sessionCorrect = 0;
  sessionWrong = []; combo = 0;
  const s = SUBJECTS[currentSubject];
  document.getElementById('quiz-back-btn').style.color = s.color;
  document.querySelector('.progress-fill').style.background = s.color;
  document.getElementById('score-badge').style.color = s.color;
  showScreen('quiz');
  renderQuestion();
}

// ===== RENDER QUESTION =====
function renderQuestion() {
  if(quizIdx >= quizQueue.length){ endQuiz(); return; }
  answered = false;
  const q = quizQueue[quizIdx];
  const s = SUBJECTS[currentSubject];

  // progress
  document.getElementById('progress-text').textContent = `${quizIdx+1} / ${quizQueue.length}`;
  document.getElementById('progress-fill').style.width = `${(quizIdx/quizQueue.length)*100}%`;
  document.getElementById('score-badge').textContent = sessionPts + 'pt';

  // level label
  const lvLabels = ['🟢 BASIC','🔵 STANDARD','🟡 ADVANCED'];
  document.getElementById('q-level').textContent = lvLabels[q._lv]||'';

  // question text
  document.getElementById('q-text').textContent = q.q;

  // SVG (bio only)
  const svgEl = document.getElementById('svg-container');
  svgEl.classList.remove('show');
  svgEl.innerHTML = '';
  if(q.svg && BIO_SVGS[q.svg]) {
    svgEl.innerHTML = BIO_SVGS[q.svg](null);
    svgEl.classList.add('show');
  }

  // choices
  let cHtml = '';
  q.choices.forEach((c,i)=>{
    cHtml += `<button class="choice-btn" onclick="answer(${i})">${c}</button>`;
  });
  document.getElementById('choices').innerHTML = cHtml;

  // explanation & next hidden
  const exp = document.getElementById('explanation-card');
  exp.classList.remove('show');
  document.getElementById('next-btn').classList.remove('show');

  // combo banner
  const cb = document.getElementById('combo-banner');
  cb.classList.remove('show');

  // timer
  clearInterval(timerInterval);
  const timerBar = document.getElementById('timer-bar');
  const tw = document.querySelector('.timer-bar-wrap');
  if(timeAttack) {
    tw.style.height='5px';tw.style.opacity='1';
    timeLeft = 30;
    timerBar.style.width='100%';
    timerBar.style.background = s.color;
    timerInterval = setInterval(()=>{
      timeLeft--;
      timerBar.style.width = (timeLeft/30*100)+'%';
      if(timeLeft<=10) timerBar.style.background='#e05c5c';
      if(timeLeft<=0){ clearInterval(timerInterval); autoWrong(); }
    },1000);
  } else {
    tw.style.height='0';tw.style.opacity='0';
  }
}

// ===== ANSWER =====
function answer(idx) {
  if(answered) return;
  answered = true;
  clearInterval(timerInterval);
  const q = quizQueue[quizIdx];
  const btns = document.querySelectorAll('.choice-btn');
  const isCorrect = idx === q.ans;

  btns[q.ans].classList.add('correct');
  if(!isCorrect) btns[idx].classList.add('wrong');

  // points
  let pts = isCorrect ? 10 : 0;
  if(isCorrect && timeAttack) pts += Math.min(10, Math.floor(timeLeft/3));
  if(isCorrect) {
    combo++;
    if(combo>=5) pts+=10;
    else if(combo>=3) pts+=5;
  } else { combo=0; }
  sessionPts += pts;
  if(isCorrect) sessionCorrect++;

  // combo banner
  if(combo>=3) {
    const cb = document.getElementById('combo-banner');
    cb.textContent = `🔥 ${combo} コンボ！ +${combo>=5?10:5}pt`;
    cb.classList.add('show');
  }

  // update stats
  updateStats(q, isCorrect);

  // explanation
  const expCard = document.getElementById('explanation-card');
  expCard.style.borderLeftColor = isCorrect ? '#69c46d' : '#e05c5c';
  document.getElementById('exp-text').textContent = q.exp;
  expCard.classList.add('show');
  document.getElementById('next-btn').classList.add('show');

  if(!isCorrect) sessionWrong.push(q);
}

function autoWrong() {
  if(answered) return;
  answered = true;
  combo = 0;
  const q = quizQueue[quizIdx];
  document.querySelectorAll('.choice-btn')[q.ans].classList.add('correct');
  updateStats(q, false);
  const expCard = document.getElementById('explanation-card');
  expCard.style.borderLeftColor='#e05c5c';
  document.getElementById('exp-text').textContent = '⏱ 時間切れ！\n' + q.exp;
  expCard.classList.add('show');
  document.getElementById('next-btn').classList.add('show');
  sessionWrong.push(q);
}

function updateStats(q, isCorrect) {
  const d = loadState(currentSubject);
  const key = q._unit;
  if(!d.unitStats[key]) d.unitStats[key]={c:0,t:0};
  d.unitStats[key].t++;
  if(isCorrect) d.unitStats[key].c++;
  d.totalAnswered = (d.totalAnswered||0)+1;
  d.points = (d.points||0) + (isCorrect?1:0); // running correct count for pts
  // wrongFreq
  if(!d.wrongFreq) d.wrongFreq={};
  if(!isCorrect) d.wrongFreq[q._id]=(d.wrongFreq[q._id]||0)+1;
  else if(d.wrongFreq[q._id]) delete d.wrongFreq[q._id];
  // wrongBank
  if(!d.wrongBank) d.wrongBank=[];
  if(!isCorrect && !d.wrongBank.includes(q._id)) d.wrongBank.push(q._id);
  if(isCorrect && isReview) d.wrongBank=d.wrongBank.filter(x=>x!==q._id);
  saveState(currentSubject, d);
}

function nextQuestion() { quizIdx++; renderQuestion(); }

function confirmQuit() {
  clearInterval(timerInterval);
  if(confirm('クイズを終了しますか？')) showHome();
}

// ===== END QUIZ =====
function endQuiz() {
  clearInterval(timerInterval);
  const total = quizQueue.length;
  const pct = total>0 ? Math.round(sessionCorrect/total*100) : 0;
  const d = loadState(currentSubject);
  d.points = (d.points||0) + sessionPts;
  saveState(currentSubject, d);

  document.getElementById('result-icon').textContent = pct>=80?'🎉':pct>=50?'😊':'💪';
  document.getElementById('result-title').textContent = pct>=80?'素晴らしい！':pct>=50?'よくできました':'もう一度挑戦！';
  document.getElementById('result-pts').textContent = '+'+sessionPts+'pt';
  document.getElementById('result-pts').style.color = SUBJECTS[currentSubject].color;
  document.getElementById('res-correct').textContent = sessionCorrect;
  document.getElementById('res-correct').style.color = '#69c46d';
  document.getElementById('res-total').textContent = total;
  document.getElementById('res-pct').textContent = pct+'%';
  document.getElementById('res-pct').style.color = pct>=70?'#69c46d':'#f4a736';

  if(sessionWrong.length>0) {
    document.getElementById('wrong-list-card').style.display='block';
    document.getElementById('wrong-list').innerHTML =
      sessionWrong.slice(0,5).map(q=>`<div class="wrong-item">❌ ${q.q.slice(0,40)}…</div>`).join('');
  } else { document.getElementById('wrong-list-card').style.display='none'; }

  const retryBtn = document.getElementById('res-retry-btn');
  if(!isReview && !isWeak) {
    retryBtn.style.display='block';
    retryBtn.textContent='もう一度';
    retryBtn.style.background = SUBJECTS[currentSubject].color;
  } else { retryBtn.style.display='none'; }

  showScreen('result');
}

function retryQuiz() { startQuiz(currentLevel); }

// ===== SCREEN =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== UTIL =====
function shuffle(a) {
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
</script>
